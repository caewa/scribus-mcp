[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "scribus-mcp"
version = "1.0.1"
description = "MCP server wrapping the Scribus 1.7 Scripter API; supports headless and interactive backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Martin", email = "william.martin@muxen.fr" }]
keywords = ["mcp", "scribus", "dtp", "publishing", "anthropic", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "markdown-it-py>=3.0",
    "Pillow>=10.2",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
scribus-mcp = "scribus_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/caewa/scribus-mcp"
Issues = "https://github.com/caewa/scribus-mcp/issues"

[tool.hatch.build]
include = [
    "src/scribus_mcp/**/*.py",
    "src/scribus_mcp/**/*.spy",
    "doc/BEST_PRACTICES.md",
]

[tool.hatch.build.targets.sdist]
# Make sure the source distribution carries the file the wheel
# force-include below depends on. Without this, ``uv build`` first
# rolls a sdist that omits ``doc/`` and the subsequent wheel build
# (which runs *inside* the sdist) errors out on the missing file.
include = [
    "src/scribus_mcp/**/*.py",
    "src/scribus_mcp/**/*.spy",
    "doc/BEST_PRACTICES.md",
    "LICENSE",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scribus_mcp"]

# Ship the LLM-facing rule sheet as package data so the best_practices
# MCP prompt can read it on installed wheels (importlib.resources looks
# inside the installed package).
[tool.hatch.build.targets.wheel.force-include]
"doc/BEST_PRACTICES.md" = "scribus_mcp/_data/BEST_PRACTICES.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003: ambiguous-unicode-character rules. This is a DTP project
# where en-dash ("0–100") and multiplication sign ("2×3") are correct typography.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
